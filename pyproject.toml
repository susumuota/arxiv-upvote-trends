[project]
name = "arxiv-upvote-trends"
version = "0.1.0"
description = "Collect trending papers from Hugging Face and alphaXiv."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "atproto>=0.0.65",
    "datasets>=4.8.5",
    "deepl>=1.30.0",
    "google-cloud-storage>=3.10.1",
    "huggingface-hub>=1.16.1",
    "joblib>=1.5.3",
    "pandas>=3.0.3",
    "pdf2image>=1.17.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentencex>=1.0.28",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "G", "I", "UP", "B", "LOG", "RUF", "T20", "DTZ", "PT", "SIM", "C4"]
