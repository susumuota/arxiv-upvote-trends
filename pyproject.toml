[project]
name = "arxiv-upvote-trends"
version = "1.0.0"
description = "Collect trending papers from Hugging Face, alphaXiv, and Hacker News."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "atproto>=0.0.72",
    "datasets>=5.0.1",
    "deepl>=1.32.0",
    "google-cloud-storage>=3.14.1",
    "huggingface-hub>=1.32.0",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentencex>=1.0.31",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "G", "I", "UP", "B", "LOG", "RUF", "T20", "DTZ", "PT", "SIM", "C4"]
